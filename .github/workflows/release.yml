name: "Release"

on:
  workflow_dispatch:

# Prevent duplicate releases
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel releases, fail instead

jobs:
  # STEP 1: Create draft release first
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Fetch all tags

      - name: Get version from tauri.conf.json and check for existing tags
        id: get-version
        shell: bash
        run: |
          BASE_VERSION=$(grep -o '"version": "[^"]*"' frontend/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Base version from tauri.conf.json: $BASE_VERSION"

          # Fetch all tags
          git fetch --tags

          # Check if base version tag exists
          if git tag -l "v${BASE_VERSION}" | grep -q .; then
            echo "Tag v${BASE_VERSION} already exists, looking for minor updates..."

            # Find all existing minor versions (e.g., 0.1.1.1, 0.1.1.2, etc.)
            LATEST_MINOR=0
            for i in $(seq 1 100); do
              if git tag -l "v${BASE_VERSION}.${i}" | grep -q .; then
                LATEST_MINOR=$i
              else
                break
              fi
            done

            # Increment to next minor version
            NEXT_MINOR=$((LATEST_MINOR + 1))

            if [ $NEXT_MINOR -gt 100 ]; then
              echo "ERROR: Maximum minor version (100) reached for ${BASE_VERSION}"
              echo "Please update the version in tauri.conf.json"
              exit 1
            fi

            VERSION="${BASE_VERSION}.${NEXT_MINOR}"
            echo "Using minor update version: $VERSION"
          else
            VERSION="${BASE_VERSION}"
            echo "Using base version: $VERSION"
          fi

          echo "Final version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `Conversationaly v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            console.log(`Created draft release with ID: ${data.id}`)
            return data.id

  # STEP 2: Build all platforms and upload directly to release
  # Note: Linux builds are excluded from release (only macOS and Windows)
  build-all-platforms:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Apple Silicon only (M1 and above)
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      asset-prefix: "conversationaly"
      upload-artifacts: false  # tauri-action uploads directly to release
      release-id: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit

  # STEP 3: Authenticode-sign the Windows installers through SignPath, then re-issue the
  # updater signatures. tauri-action computed the .sig files over the *unsigned*
  # installers, so shipping them as-is breaks auto-update for every Windows user: the
  # bytes they download no longer match the signature the app checks.
  sign-windows:
    needs: [create-release, build-all-platforms]
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Locate the unsigned installer artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ID=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                 --jq '.artifacts[] | select(.name == "unsigned-windows-installers") | .id' | head -1)
          if [ -z "$ID" ]; then
            echo "::error::No unsigned-windows-installers artifact. Did the Windows build fail?"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Sign installers via SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.artifact.outputs.id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "1800"
          output-artifact-directory: signed

      # The whole point of this job. If SignPath hands back unsigned files the release
      # must fail here, not ship a binary SmartScreen will block.
      - name: Verify Authenticode signatures
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode
          shopt -s nullglob
          FILES=(signed/*.msi signed/*.exe)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::SignPath returned no installers"
            exit 1
          fi
          for f in "${FILES[@]}"; do
            echo "--- $f"
            OUT=$(osslsigncode verify -in "$f" 2>&1) || true
            echo "$OUT"
            # Presence, not chain validity: without a -CAfile osslsigncode can reject a
            # perfectly good signature, and chain trust is SignPath's problem, not ours.
            if ! grep -qE "Number of signers: [1-9]" <<< "$OUT"; then
              echo "::error::$f came back from SignPath without an Authenticode signature"
              exit 1
            fi
          done

      - name: Re-issue updater signatures over the signed installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          for f in signed/*.msi signed/*.exe; do
            npx --yes @tauri-apps/cli@2.11.4 signer sign "$f"
          done
          ls -la signed

      - name: Publish signed installers to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ needs.create-release.outputs.version }}"
          RID="${{ needs.create-release.outputs.release-id }}"
          R="${{ github.repository }}"

          # A draft release has no git tag yet, so latest.json is not reachable by tag
          # through the API. Go via the asset id instead.
          AID=$(gh api "repos/$R/releases/$RID/assets" --jq '.[] | select(.name == "latest.json") | .id')
          if [ -z "$AID" ]; then
            echo "::error::latest.json missing from the release; the updater manifest cannot be patched"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/$R/releases/assets/$AID" > latest.json

          # ponytail: plain basename, no percent-decoding. productName and version are
          # both slug-safe today, so no filename here can contain an escaped character.
          WIN_FILE=$(basename "$(jq -r '.platforms["windows-x86_64"].url' latest.json)")
          if [ ! -f "signed/$WIN_FILE.sig" ]; then
            echo "::error::latest.json points at $WIN_FILE but SignPath returned no signed/$WIN_FILE"
            exit 1
          fi
          SIG=$(cat "signed/$WIN_FILE.sig")
          KEYS_BEFORE=$(jq -Sc '.platforms | keys' latest.json)
          jq --arg s "$SIG" '.platforms["windows-x86_64"].signature = $s' \
            latest.json > latest.patched.json
          mv latest.patched.json latest.json

          # A wrong jq path adds a sibling key instead of replacing the signature, and
          # every Windows auto-update then fails against a manifest that reads fine.
          # Check both the value and that no platform key appeared or vanished.
          jq -e --arg s "$SIG" '.platforms["windows-x86_64"].signature == $s' latest.json > /dev/null \
            || { echo "::error::latest.json signature patch did not take"; exit 1; }
          if [ "$(jq -Sc '.platforms | keys' latest.json)" != "$KEYS_BEFORE" ]; then
            echo "::error::latest.json platform keys changed: $KEYS_BEFORE -> $(jq -Sc '.platforms | keys' latest.json)"
            exit 1
          fi

          # Same filenames as the unsigned uploads, so --clobber replaces them in place.
          gh release upload "v$V" signed/* latest.json --clobber

          echo "Replaced on the release:" >> $GITHUB_STEP_SUMMARY
          for f in signed/*; do echo "- \`$(basename "$f")\`" >> $GITHUB_STEP_SUMMARY; done
          echo "- \`latest.json\` (windows-x86_64 signature re-issued)" >> $GITHUB_STEP_SUMMARY

  # STEP 4: Show release summary
  release-summary:
    needs: [create-release, build-all-platforms, sign-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get release assets and latest.json
        id: release-info
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          RELEASE_ID="${{ needs.create-release.outputs.release-id }}"

          echo "## Release Assets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # List all release assets
          echo "### Files in Release" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          gh api repos/${{ github.repository }}/releases/${RELEASE_ID}/assets --jq '.[] | "\(.name) (\(.size / 1048576 | floor)MB)"' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Download and show latest.json
          echo "### latest.json content" >> $GITHUB_STEP_SUMMARY
          gh release download "v${VERSION}" --pattern "latest.json" --dir . 2>/dev/null || echo "latest.json not yet available"
          if [ -f latest.json ]; then
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat latest.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Download links
          echo "### Download Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release page:** https://github.com/${{ github.repository }}/releases/tag/v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download all as ZIP:** https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.zip" >> $GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "============================================"
          echo "=== Release Created Successfully ==="
          echo "============================================"
          echo "Version: v${{ needs.create-release.outputs.version }}"
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.create-release.outputs.version }}"
          echo ""
          echo "Uploaded assets (via tauri-action):"
          echo "  - macOS: DMG installer + app.tar.gz (for updater) + .sig"
          echo "  - Windows: MSI + NSIS installers (Authenticode-signed via SignPath) + re-issued .sig files"
          echo "  - Updater manifest: latest.json (auto-generated by tauri-action)"
          echo ""
          echo "Next steps:"
          echo "  1. Review the draft release"
          echo "  2. Edit release notes if needed"
          echo "  3. Publish the release when ready"
          echo "============================================"

          # Add to GitHub Step Summary
          echo "## Release Created Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ needs.create-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** [View Release](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.create-release.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Uploaded Assets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Assets |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **macOS** | DMG installer, app.tar.gz (updater), .sig |" >> $GITHUB_STEP_SUMMARY
          echo "| **Windows** | MSI + NSIS installers (SignPath-signed), re-issued .sig files |" >> $GITHUB_STEP_SUMMARY
          echo "| **Updater** | latest.json manifest (auto-generated by tauri-action) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. [Review the draft release](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.create-release.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "2. Edit release notes if needed" >> $GITHUB_STEP_SUMMARY
          echo "3. Publish the release when ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
